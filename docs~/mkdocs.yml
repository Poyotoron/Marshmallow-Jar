site_name: Marshmallow Jar
site_url: https://ghp.maaaaa.net/Marshmallow-Jar/
repo_url: https://github.com/Poyotoron/Marshmallow-Jar
site_dir: site

theme:
  name: material
  language: ja
  custom_dir: overrides
  # サイト共通のファビコン。実体は www.maaaaa.net 側にあり、そちらを差し替えれば全ツールに反映される
  favicon: https://www.maaaaa.net/favicon.png
  features:
    - navigation.sections
    - navigation.expand
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: ダークテーマに切り替える
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: ライトテーマに切り替える

plugins:
  - search:
      lang: ja

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  marshmallow_jar_version: !ENV [MARSHMALLOW_JAR_VERSION, dev]

nav:
  - はじめに: index.md
  - インストール: install.md
  - 設定画面: settings.md
  - エディタ機能:
      - Hierarchy のチェックボックス: hierarchy.md
      - Prefab Variant の名前: variant.md
      - シーンのライティング: scene-lighting.md
      - VRChat SDK への自動入力: sdk-autofill.md
      - Inspector を別ウィンドウで開く: inspector.md
      - ブレンドシェイプのスライダー: blendshape-sliders.md
      - 完了通知: notifications.md
  - Irodori Colorizer:
      - 概要と使い方: colorizer.md
      - プリセット: colorizer-presets.md
      - 設定: colorizer-settings.md
      - 色の付き方: colorizer-behavior.md
      - 色で絞り込む: colorizer-filter.md
      - 単体版からの移行: colorizer-migration.md
  - 困ったときは: troubleshooting.md
  - 更新履歴: changelog.md
